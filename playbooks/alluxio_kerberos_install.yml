---
- name: Kerberos alluxio cluster install
  hosts: alluxio_cluster
  strategy: linear
  tasks:
    - tosit.tdp.resolve: # noqa unnamed-task
        node_name: alluxio_cluster
    - name: Install Alluxio cluster Kerberos
      ansible.builtin.import_role:
        name: tosit.tdp.alluxio.client
        tasks_from: kerberos
    - ansible.builtin.meta: clear_facts # noqa unnamed-task
