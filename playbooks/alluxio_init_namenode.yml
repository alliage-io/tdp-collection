---
- name: Alluxio Start Journal Node
  hosts: alluxio_nn[0]
  tasks:
    - tosit.tdp.resolve: # noqa unnamed-task
        node_name: hdfs_namenode
    - name: Start active  HDFS namenode
      ansible.builtin.import_role:
        name: tosit.tdp.alluxio.journalnode
        tasks_from: init
    - ansible.builtin.meta: clear_facts # noqa unnamed-task
- name: Alluxio Start Namenode 
  hosts: alluxio_nn[1]
  tasks:
    - tosit.tdp.resolve: # noqa unnamed-task
        node_name: hdfs_namenode
    - name: Start standby HDFS namenode
      ansible.builtin.import_role:
        name: tosit.tdp.alluxio.namenode
        tasks_from: init
    - ansible.builtin.meta: clear_facts # noqa unnamed-task
- name: Alluxio Start Namenode 
  hosts: alluxio_nn[2]
  tasks:
    - tosit.tdp.resolve: # noqa unnamed-task
        node_name: hdfs_namenode
    - name: Start standby HDFS namenode
      ansible.builtin.import_role:
        name: tosit.tdp.alluxio.namenode
        tasks_from: init
    - ansible.builtin.meta: clear_facts # noqa unnamed-task
