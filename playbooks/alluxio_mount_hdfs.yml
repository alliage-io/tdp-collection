---
- name: Alluxio Mount Hdfs Under File Storage
  hosts: edge
  tasks:
      - tosit.tdp.resolve: # noqa unnamed-task
          node_name: alluxio_nn
      - name: Config alluxio namenode
        ansible.builtin.import_role:
          name: tosit.tdp.alluxio.common
          tasks_from: nested_mount_hdfs
      - ansible.builtin.meta: clear_facts # noqa unnamed-task
