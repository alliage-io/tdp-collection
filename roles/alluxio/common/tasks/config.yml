---
- name: Create symbolic link to alluxio installation
  ansible.builtin.file:
    src: "{{ hadoop_conf_dir }}/core-site.xml"
    dest: "{{ alluxio_conf_dir }}/core-site.xml"
    state: link
  
- name: Create symbolic link to alluxio installation
  ansible.builtin.file:
    src:  "{{ hadoop_conf_dir }}/hdfs-site.xml"
    dest: "{{ alluxio_conf_dir }}/hdfs-site.xml"
    state: link

- name: Template alluxio-env
  ansible.builtin.template:
    src: alluxio-env.sh.j2
    dest: "{{ alluxio_conf_dir }}/alluxio-env.sh"
    group: root
    owner: root
    mode: "755"

- name: Config Masters File
  ansible.builtin.template:
    src: masters.j2
    dest: "{{ alluxio_conf_dir }}/masters"
    group: root
    owner: root
    mode: "755"

- name: Config Workers File
  ansible.builtin.template:
    src: workers.j2
    dest: "{{ alluxio_conf_dir }}/workers"
    group: root
    owner: root
    mode: "755"
