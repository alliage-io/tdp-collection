

---
- name: Kinit for hdfs
  ansible.builtin.command: kinit -kt /etc/security/keytabs/hdfs.headless.keytab {{ hdfs_headless_principal }}@{{ realm }}

- name: Mounting HDFS UFS
  ansible.builtin.shell: |
    {{ alluxio_root_dir }}/alluxio/bin/alluxio fs mount /mnt/hdfs31 hdfs://{{ cluster_name }}/alluxio/data
  ignore_errors: true

- name: Kinit for hdfs
  ansible.builtin.command: kdestroy
